<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- initial-scale=1 with no maximum-scale: pinch-zoom stays available. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A0A0B" />
    <meta
      name="description"
      content="Listens to the music around you, works out what is playing and how far in you are, then shows the lyrics in time with the room."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Fonts. preconnect opens the connection to the font host early so the
      stylesheet request doesn't pay for DNS + TLS when it arrives.
      display=swap draws fallback text immediately rather than leaving the
      page blank while the webfont downloads.

      Archivo is loaded as a variable font across both its width and weight
      axes in one file, so the huge lyric type can shift weight and condense
      without a second network request.

      Golos Text is here for one reason: Archivo has no Cyrillic. Without it
      every Russian and Kazakh lyric fell through to Arial. Google serves each
      family split by script with a unicode-range on every @font-face, so a
      page of English lyrics never downloads the Cyrillic files and a page of
      Kazakh ones never downloads the Latin — the extra family costs nothing
      until there is Cyrillic on screen to need it.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Golos+Text:wght@400..900&family=JetBrains+Mono:wght@400..700&display=swap"
    />

    <title>LiveLyrics — lyrics, in time with the room</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
